<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registration Form Validation</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="flex items-center justify-center min-h-screen bg-gray-100">

  <form id="registrationForm" class="bg-white p-8 rounded-2xl shadow-md w-80 sm:w-96">
    <h2 class="text-2xl font-semibold text-center mb-6 text-gray-700">Registration Form</h2>

    <!-- Name Field -->
    <div class="mb-4">
      <label for="name" class="block text-gray-700 font-medium mb-1">Name</label>
      <input type="text" id="name" class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Enter your name">
      <p id="nameError" class="text-red-500 text-sm mt-1"></p>
    </div>

    <!-- Email Field -->
    <div class="mb-4">
      <label for="email" class="block text-gray-700 font-medium mb-1">Email</label>
      <input type="email" id="email" class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Enter your email">
      <p id="emailError" class="text-red-500 text-sm mt-1"></p>
    </div>

    <!-- Password Field -->
    <div class="mb-4">
      <label for="password" class="block text-gray-700 font-medium mb-1">Password</label>
      <input type="password" id="password" class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Enter password">
      <p id="passwordError" class="text-red-500 text-sm mt-1"></p>
    </div>

    <!-- Submit Button -->
    <button type="submit" id="submitBtn" disabled
      class="w-full bg-blue-500 text-white py-2 rounded-lg mt-4 opacity-50 cursor-not-allowed transition-all duration-300">
      Register
    </button>
  </form>

  <script>
    const nameInput = document.getElementById('name');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const submitBtn = document.getElementById('submitBtn');

    const nameError = document.getElementById('nameError');
    const emailError = document.getElementById('emailError');
    const passwordError = document.getElementById('passwordError');

    const emailPattern = /^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/;

    function validateForm() {
      let valid = true;

      // Validate name
      if (nameInput.value.trim() === '') {
        nameError.textContent = 'Name cannot be empty';
        valid = false;
      } else {
        nameError.textContent = '';
      }

      // Validate email
      if (!emailPattern.test(emailInput.value.trim())) {
        emailError.textContent = 'Invalid email address';
        valid = false;
      } else {
        emailError.textContent = '';
      }

      // Validate password
      if (passwordInput.value.length < 6) {
        passwordError.textContent = 'Password must be at least 6 characters';
        valid = false;
      } else {
        passwordError.textContent = '';
      }

      // Enable or disable button
      if (valid) {
        submitBtn.disabled = false;
        submitBtn.classList.remove('opacity-50', 'cursor-not-allowed');
        submitBtn.classList.add('hover:bg-blue-600');
      } else {
        submitBtn.disabled = true;
        submitBtn.classList.add('opacity-50', 'cursor-not-allowed');
        submitBtn.classList.remove('hover:bg-blue-600');
      }
    }

    nameInput.addEventListener('input', validateForm);
    emailInput.addEventListener('input', validateForm);
    passwordInput.addEventListener('input', validateForm);

    document.getElementById('registrationForm').addEventListener('submit', (e) => {
      e.preventDefault();
      alert('🎉 Registration Successful!');
    });
  </script>
</body>
</html>
